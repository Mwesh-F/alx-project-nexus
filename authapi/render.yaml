services:
  - type: web
    name: miss-kenya-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn authapi.wsgi
    plan: free
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_DEBUG
        value: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: "*"
